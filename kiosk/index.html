<body>
<div id="fit"><div id="machine">
  <div class="shield l"></div><div class="shield r"></div>

    <div class="sign"><p id="sgApp"></p><span class="sqr" id="sgQr"></span><b class="smeth" id="sgMeth"></b><img src="../assets/logo.svg?v=1795621086" alt="iAM Smart"><span class="shot"><small id="sgHot"></small><b>182 123</b></span></div>

  </div>
  <div class="mid">
    <div class="tray">
      <i class="speaker"></i>
      <div class="slotbox"><div class="orange"><b id="sgCard"></b></div>

        <div class="chipsign"><i></i><small id="sgChip"></small></div></div>
      <i class="braille"></i>
    </div>
    <i class="scanner"></i>
    <div class="mlogo"><img src="../assets/logo.svg?v=1795621086" alt="iAM Smart"></div>
    <i class="strip sl"></i><i class="strip sr"></i>
  </div>
  <div class="low"><i class="strip sl"></i><i class="strip sr"></i></div>
  <div class="foot"></div>
</div></div>
<button type="button" id="mode"></button>
